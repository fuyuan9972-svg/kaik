[package]
name = "ai-paper-rewriter"
version = "0.1.1"
description = "AI paper rewriter desktop app"
authors = ["kaikai"]
edition = "2021"

[lib]
name = "ai_paper_rewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-paper-rewriter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1.0"
docx-rs = "0.4"
pdf-extract = "0.7"
quick-xml = "0.37"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
tauri-plugin-store = "2.2"
thiserror = "2.0"
tokio = { version = "1.42", features = ["time"] }
zip = "2.2"
